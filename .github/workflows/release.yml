name: LocalShare signed release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

env:
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install Rust/MSVC
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add x86_64-pc-windows-msvc
      - name: Install and test
        shell: pwsh
        run: |
          npm ci
          npm run build
          npm run lint
          npm run test
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          cargo check --locked --all-targets --manifest-path src-tauri/Cargo.toml
          cargo clippy --locked --all-targets --all-features --manifest-path src-tauri/Cargo.toml -- -D warnings
          cargo test --locked --all-targets --manifest-path src-tauri/Cargo.toml
          $env:LOCALSHARE_TEST_SIZE_MB = '100'
          $env:LOCALSHARE_TEST_ROOT = '.localshare-test-work/two-node'
          cargo run --locked --features two-node --bin two_node --manifest-path src-tauri/Cargo.toml
      - name: Build signed Windows bundles
        shell: pwsh
        run: .\scripts\build-windows.ps1 -SkipInstall -SkipFrontend -SkipRustChecks
      - name: Collect Windows release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          Copy-Item release\windows\LocalShare-Setup.exe release-assets\
          $signature = Get-ChildItem src-tauri\target\x86_64-pc-windows-msvc\release\bundle\nsis -Filter '*.sig' -File |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $signature) { throw 'The signed Windows updater signature was not emitted.' }
          Copy-Item $signature.FullName release-assets\LocalShare-Setup.exe.sig
          Copy-Item release\windows\SHA256SUMS.txt release-assets\
      - uses: actions/upload-artifact@v4
        with:
          name: signed-windows-assets
          path: release-assets

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install packaging tools
        run: brew install llvm
      - name: Install and test
        run: |
          npm ci
          npm run build
          npm run lint
          npm run test
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          cargo check --locked --all-targets --manifest-path src-tauri/Cargo.toml
          cargo clippy --locked --all-targets --all-features --manifest-path src-tauri/Cargo.toml -- -D warnings
          cargo test --locked --all-targets --manifest-path src-tauri/Cargo.toml
      - name: Build signed macOS bundles
        run: ./scripts/build-macos.sh
      - name: Collect macOS release assets
        run: |
          mkdir -p release-assets
          cp src-tauri/target/release/bundle/macos/*.dmg release-assets/
          cp src-tauri/target/release/bundle/macos/*.app.tar.gz release-assets/
          cp src-tauri/target/release/bundle/macos/*.sig release-assets/
      - uses: actions/upload-artifact@v4
        with:
          name: signed-macos-assets
          path: release-assets

  android-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install Rust Android target
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-linux-android
      - name: Build Android validation APK
        run: |
          npm ci
          npm run lint
          npm run test
          npm run tauri android init
          python3 scripts/patch-android-manifest.py
          npm run tauri android build -- --ci --debug --apk --target aarch64
      - name: Collect Android validation artifact
        run: |
          mkdir -p release-assets
          find src-tauri/gen/android/app/build/outputs -type f -name '*.apk' -exec cp {} release-assets/LocalShare-android-aarch64-debug.apk \;
          test -s release-assets/LocalShare-android-aarch64-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: signed-android-assets
          path: release-assets/LocalShare-android-aarch64-debug.apk

  publish:
    needs: [windows, macos, android-validation]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: signed-*-assets
          merge-multiple: true
          path: release-assets
      - name: Create updater manifest
        shell: bash
        run: python3 scripts/create-update-manifest.py --version "${GITHUB_REF_NAME#v}" --assets release-assets --output release-assets/latest.json
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/* --repo "$GITHUB_REPOSITORY" --title "LocalShare $GITHUB_REF_NAME" --generate-notes
