[package]
name = "localshare-core"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
base64 = "0.22"
blake3 = "1"
chrono = { version = "0.4", features = ["serde", "clock"] }
futures-util = "0.3"
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native-sync-persistent"] }
hex = "0.4"
mdns-sd = "0.11"
rcgen = "0.13"
rusqlite = { version = "0.32", features = ["bundled"] }
rustls = "0.23"
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-rustls = "0.26"
tracing = "0.1"
uuid = { version = "1", features = ["serde", "v4"] }
webpki-roots = "0.26"
